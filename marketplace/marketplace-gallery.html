<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loraniq Admin | Marketplace Graphics</title>
  <style>
    :root{color-scheme:light;background:#edf6ff;color:#172954;font-family:Tahoma,Arial,sans-serif}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#f8fbff,#e3f1ff);min-height:100vh}
    main{max-width:1220px;margin:auto;padding:46px 20px 80px}.eyebrow{color:#5d4bda;font-size:12px;font-weight:800;letter-spacing:.08em}
    h1{margin:8px 0;font-size:clamp(28px,5vw,52px);letter-spacing:-.03em}p{color:#607798;line-height:1.9;margin:0}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px;margin-top:30px}
    figure{margin:0;padding:12px;border:1px solid #c9dcef;border-radius:24px;background:#fff;box-shadow:0 20px 50px #40638d1c}figure:nth-child(1){grid-column:span 4}figure:nth-child(2),figure:nth-child(3){grid-column:span 4}figure:nth-child(4){grid-column:span 12}figure:nth-child(5){grid-column:span 3}
    a{display:block;color:inherit;text-decoration:none}img{display:block;width:100%;height:100%;max-height:760px;object-fit:contain;border-radius:16px;background:#edf6ff}figcaption{padding:12px 4px 4px;font-size:13px;color:#29436f;font-weight:800}
    @media(max-width:720px){figure:nth-child(n){grid-column:span 12}main{padding:28px 14px 50px}}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">LORANIQ ADMIN · MARKETPLACE KIT</div>
    <h1>کاور، اینفوگرافی و آیکن محصول</h1>
    <p>خروجی‌های گرافیکی نهایی برای انتشار در ژاکت.</p>
    <section class="grid">
      <figure><a href="cover-400.png"><img src="cover-400.png" alt="کاور ۴۰۰ در ۴۰۰"><figcaption>کاور ۴۰۰×۴۰۰</figcaption></a></figure>
      <figure><a href="cover-700-overview.png"><img src="cover-700-overview.png" alt="کاور معرفی محصول"><figcaption>کاور ۷۰۰×۷۰۰ · معرفی</figcaption></a></figure>
      <figure><a href="cover-700-features.png"><img src="cover-700-features.png" alt="کاور ویژگی‌های محصول"><figcaption>کاور ۷۰۰×۷۰۰ · ویژگی‌ها</figcaption></a></figure>
      <figure><a href="infographic.png"><img src="infographic.png" alt="اینفوگرافی ویژگی‌های Loraniq Admin"><figcaption>اینفوگرافی ویژگی‌ها</figcaption></a></figure>
      <figure><a href="icon-80.png"><img src="icon-80.png" alt="آیکن محصول"><figcaption>آیکن ۸۰×۸۰</figcaption></a></figure>
    </section>
  </main>
</body>
</html>
