<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loraniq Admin | Marketplace Graphics</title>
  <style>
    :root{color-scheme:dark;background:#11131f;color:#f6f4ff;font-family:Tahoma,Arial,sans-serif}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#2d2550,#11131f 42%);min-height:100vh}
    main{max-width:1180px;margin:auto;padding:42px 20px 70px}.eyebrow{color:#b9a8ff;font-size:12px;font-weight:700;letter-spacing:.08em}
    h1{margin:8px 0;font-size:clamp(28px,5vw,52px)}p{color:#b9bdd0;line-height:1.9}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-top:30px}
    figure{margin:0;padding:10px;border:1px solid #3d4057;border-radius:18px;background:#202236;box-shadow:0 18px 45px #0003}figure:nth-child(1){grid-column:span 4}figure:nth-child(2),figure:nth-child(3){grid-column:span 4}figure:nth-child(4){grid-column:span 8}figure:nth-child(5){grid-column:span 4}
    a{display:block;color:inherit;text-decoration:none}img{display:block;width:100%;height:100%;max-height:560px;object-fit:contain;border-radius:12px;background:#171925}figcaption{padding:12px 4px 4px;font-size:13px;color:#e8e5f8;font-weight:700}
    @media(max-width:720px){figure:nth-child(n){grid-column:span 12}main{padding:28px 14px 50px}}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">LORANIQ ADMIN · MARKETPLACE KIT</div>
    <h1>کاور، اینفوگرافی و آیکن محصول</h1>
    <p>خروجی‌های گرافیکی نهایی برای انتشار در ژاکت.</p>
    <section class="grid">
      <figure><a href="cover-400.png"><img src="cover-400.png" alt="کاور ۴۰۰ در ۴۰۰"><figcaption>کاور ۴۰۰×۴۰۰</figcaption></a></figure>
      <figure><a href="cover-700-overview.png"><img src="cover-700-overview.png" alt="کاور معرفی محصول"><figcaption>کاور ۷۰۰×۷۰۰ · معرفی</figcaption></a></figure>
      <figure><a href="cover-700-features.png"><img src="cover-700-features.png" alt="کاور ویژگی‌های محصول"><figcaption>کاور ۷۰۰×۷۰۰ · ویژگی‌ها</figcaption></a></figure>
      <figure><a href="infographic.png"><img src="infographic.png" alt="اینفوگرافی ویژگی‌های Loraniq Admin"><figcaption>اینفوگرافی ویژگی‌ها</figcaption></a></figure>
      <figure><a href="icon-80.png"><img src="icon-80.png" alt="آیکن محصول"><figcaption>آیکن ۸۰×۸۰</figcaption></a></figure>
    </section>
  </main>
</body>
</html>
