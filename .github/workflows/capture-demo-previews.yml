name: Capture Loraniq demo previews

on:
  push:
    paths:
      - '.github/workflows/capture-demo-previews.yml'
      - 'scripts/capture-demo-previews.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
      - name: Install Playwright runtime
        run: |
          pnpm add --save-dev --lockfile=false playwright@1.55.0
          pnpm exec playwright install --with-deps chromium
      - name: Capture real deployed dashboards
        env:
          LORANIQ_PREVIEW_URL: https://has5an-hash.github.io/loraniq-admin/
        run: node scripts/capture-demo-previews.mjs
      - name: Commit generated previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/demo-previews/*.jpg
          if git diff --cached --quiet; then
            echo "Preview images unchanged"
          else
            git commit -m "chore: refresh real dashboard preview assets"
            git push
          fi
