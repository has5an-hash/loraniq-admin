name: Loraniq Mobile Overflow Diagnostic

on:
  push:
    branches: [release-prep-2026-09-09]
    paths: [.github/workflows/mobile-components-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Start preview
        shell: bash
        run: |
          npm run start -- --port 8787 >/tmp/preview.log 2>&1 &
          echo $! >/tmp/preview.pid
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8787/demo/commerce >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/preview.log
          exit 1
      - name: Install diagnostic helper
        run: npm install --no-save puppeteer-core@24 --no-audit --no-fund
      - name: Inspect all demos at exact QA viewport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic/screenshots
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          CHROME_PATH="$chrome" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import puppeteer from 'puppeteer-core';

          const routes = ['commerce','analytics','projects','finance','crm','academy','calendar','inbox','components','settings'];
          const browser = await puppeteer.launch({
            executablePath: process.env.CHROME_PATH,
            headless: true,
            args: ['--no-sandbox', '--disable-dev-shm-usage', '--disable-gpu']
          });
          const report = {};

          for (const route of routes) {
            const page = await browser.newPage();
            await page.setViewport({ width: 390, height: 844, deviceScaleFactor: 1 });
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(String(error?.stack || error)));
            const response = await page.goto(`http://127.0.0.1:8787/demo/${route}`, { waitUntil: 'networkidle2', timeout: 30000 });
            await new Promise(resolve => setTimeout(resolve, 1000));

            const metrics = await page.evaluate(() => {
              const vw = innerWidth;
              const describe = (el) => {
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return {
                  tag: el.tagName.toLowerCase(),
                  className: typeof el.className === 'string' ? el.className : '',
                  id: el.id || '',
                  rect: { left: Math.round(r.left), right: Math.round(r.right), width: Math.round(r.width), top: Math.round(r.top), height: Math.round(r.height) },
                  clientWidth: el.clientWidth,
                  scrollWidth: el.scrollWidth,
                  display: s.display,
                  position: s.position,
                  overflowX: s.overflowX,
                  minWidth: s.minWidth,
                  maxWidth: s.maxWidth,
                };
              };
              const all = [...document.querySelectorAll('body *')];
              const offenders = all
                .filter(el => {
                  const r = el.getBoundingClientRect();
                  if (!r.width || !r.height) return false;
                  const s = getComputedStyle(el);
                  if (s.position === 'fixed' && r.right <= 0) return false;
                  return r.left < -1 || r.right > vw + 1;
                })
                .map(describe)
                .sort((a,b) => Math.max(Math.abs(b.rect.left), b.rect.right - vw) - Math.max(Math.abs(a.rect.left), a.rect.right - vw))
                .slice(0, 25);
              const pick = selector => {
                const el = document.querySelector(selector);
                return el ? describe(el) : null;
              };
              return {
                viewport: { width: vw, height: innerHeight },
                document: { clientWidth: document.documentElement.clientWidth, scrollWidth: document.documentElement.scrollWidth },
                body: { clientWidth: document.body.clientWidth, scrollWidth: document.body.scrollWidth },
                key: {
                  admin: pick('main.admin'),
                  page: pick('.admin-page'),
                  top: pick('.admin-top'),
                  content: pick('.admin-content'),
                  stats: pick('.a-stats'),
                  grid: pick('.a-grid'),
                  orders: pick('.orders'),
                  projectBoard: pick('.project-board'),
                  componentGrid: pick('.component-grid'),
                  calendar: pick('.calendar-view')
                },
                offenders
              };
            });

            report[route] = { status: response?.status(), pageErrors, metrics };
            await page.screenshot({ path: `diagnostic/screenshots/${route}.png`, fullPage: false });
            await page.close();
          }

          await browser.close();
          fs.writeFileSync('diagnostic/mobile-overflow.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-overflow-diagnostic-${{ github.run_id }}
          path: diagnostic
          retention-days: 7
