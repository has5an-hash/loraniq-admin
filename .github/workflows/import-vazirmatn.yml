name: Import Vazirmatn Asset

on:
  push:
    paths:
      - '.github/workflows/import-vazirmatn.yml'

permissions:
  contents: write

jobs:
  import-font:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download official Vazirmatn variable webfont and license
        run: |
          set -euo pipefail
          mkdir -p app/fonts Licenses
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/webfonts/Vazirmatn%5Bwght%5D.woff2' \
            --output 'app/fonts/Vazirmatn.woff2'
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/OFL.txt' \
            --output 'Licenses/Vazirmatn-OFL-1.1.txt'
          test "$(stat -c%s app/fonts/Vazirmatn.woff2)" -gt 100000
          grep -q 'SIL OPEN FONT LICENSE Version 1.1' Licenses/Vazirmatn-OFL-1.1.txt

      - name: Commit vendored font assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/fonts/Vazirmatn.woff2 Licenses/Vazirmatn-OFL-1.1.txt
          if git diff --cached --quiet; then
            echo 'Font assets already present.'
            exit 0
          fi
          git commit -m 'assets: vendor official Vazirmatn variable webfont'
          git push origin HEAD:main
