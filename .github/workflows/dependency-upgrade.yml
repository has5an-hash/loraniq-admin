name: Loraniq Secure Dependency Upgrade

on:
  push:
    branches:
      - release-prep-2026-09-09
    paths:
      - .github/workflows/dependency-upgrade.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release-prep-2026-09-09

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install current lockfile
        run: npm ci --no-audit --no-fund

      - name: Upgrade vulnerable dependencies to patched versions
        run: |
          npm install \
            next@16.3.4 \
            eslint-config-next@16.3.4 \
            react@19.3.0 \
            react-dom@19.3.0 \
            react-server-dom-webpack@19.3.0 \
            vinext@1.0.0-beta.9 \
            @vitejs/plugin-rsc@0.5.34 \
            @cloudflare/vite-plugin@1.54.6 \
            @cloudflare/workers-types@5.20260908.1 \
            vite@8.2.2 \
            wrangler@4.114.0 \
            --save-exact --no-audit --no-fund
          npm audit fix --no-audit --no-fund

      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=high

      - name: Verify codebase
        run: |
          npm run lint
          npm run typecheck
          npm run build

      - name: Commit lockfile update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes required."
            exit 0
          fi
          git commit -m "security: upgrade vulnerable production dependencies"
          git push origin HEAD:release-prep-2026-09-09
