name: One-time Loraniq source import

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download transferred source bundle
        env:
          SOURCE_SHARE_URL: https://firestorage.ai/ja/f/57GJATL-vMF1
          SOURCE_FILE_NAME: loraniq-source-clean.zip
        run: |
          set -euo pipefail
          mkdir -p /tmp/loraniq-transfer
          cd /tmp/loraniq-transfer
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-audit --no-fund >/dev/null
          npx playwright install chromium >/dev/null
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const url = process.env.SOURCE_SHARE_URL;
          const filename = process.env.SOURCE_FILE_NAME;
          const target = `/tmp/${filename}`;

          async function clickForDownload(page, locator) {
            if (!(await locator.count())) return false;
            try {
              const downloadPromise = page.waitForEvent('download', { timeout: 15000 });
              await locator.first().click();
              const download = await downloadPromise;
              await download.saveAs(target);
              return true;
            } catch {
              return false;
            }
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ acceptDownloads: true });
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(2500);

            let ok = await clickForDownload(page, page.getByText(filename, { exact: false }));
            if (!ok) {
              const candidates = page.locator('a[href],button');
              const count = await candidates.count();
              for (let i = 0; i < count && !ok; i++) {
                const item = candidates.nth(i);
                const text = ((await item.innerText().catch(() => '')) || '').trim();
                const href = (await item.getAttribute('href').catch(() => null)) || '';
                if (text.includes(filename) || /download|ダウンロード|zip/i.test(`${text} ${href}`)) {
                  ok = await clickForDownload(page, item);
                }
              }
            }

            if (!ok) {
              const links = await page.locator('a[href]').evaluateAll((items) => items.map((a) => ({ text: a.textContent || '', href: a.href })));
              const candidate = links.find((x) => x.href.toLowerCase().includes('.zip') || /download/i.test(x.href));
              if (candidate) {
                const response = await page.request.get(candidate.href);
                if (response.ok()) {
                  fs.writeFileSync(target, await response.body());
                  ok = true;
                }
              }
            }

            await browser.close();
            if (!ok || !fs.existsSync(target) || fs.statSync(target).size < 1000) {
              throw new Error('Could not retrieve the transferred source archive from the temporary share.');
            }
            console.log(`Downloaded ${target} (${fs.statSync(target).size} bytes)`);
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Import clean source tree
        run: |
          set -euo pipefail
          rm -rf /tmp/loraniq-import
          mkdir -p /tmp/loraniq-import
          unzip -q /tmp/loraniq-source-clean.zip -d /tmp/loraniq-import
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/workflows/import-source.yml' \
            /tmp/loraniq-import/ ./
          rm -f .github/workflows/import-source.yml

      - name: Commit imported Work checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to import.'
            exit 0
          fi
          git commit -m 'chore: import Loraniq Work checkpoint source'
          git push origin HEAD:main
