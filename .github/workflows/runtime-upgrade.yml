name: Loraniq Runtime Compatibility Upgrade

on:
  push:
    branches:
      - release-prep-2026-09-09
    paths:
      - .github/workflows/runtime-upgrade.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release-prep-2026-09-09

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Upgrade Wrangler runtime
        run: npm install wrangler@4.130.0 --save-exact --no-audit --no-fund

      - name: Verify production security and codebase
        run: |
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm run typecheck
          npm run build

      - name: Verify built runtime starts
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --port 8787 > /tmp/loraniq-runtime.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:8787/ >/dev/null; then
              echo "Runtime preview is ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/loraniq-runtime.log
          exit 1

      - name: Commit lockfile update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No runtime changes required."
            exit 0
          fi
          git commit -m "runtime: upgrade Wrangler for current compatibility date"
          git push origin HEAD:release-prep-2026-09-09
