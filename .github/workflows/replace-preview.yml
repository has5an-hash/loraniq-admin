name: Replace public preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-preview.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download verified preview artifact
        env:
          ARTIFACT_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-e660-81f4-9c97-afcca32280e7/raw?se=2026-09-23T18%3A56%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=7a8e3ff6-7c4f-5d3e-9472-7837229f7e8f&skoid=8981e47a-681f-4a6a-b86c-73d6347614b7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T16%3A20%3A02Z&ske=2026-09-24T16%3A20%3A02Z&sks=b&skv=2026-02-06&sig=j193aD8aKtK4sTDqE9pd9wNDc0lz1uiQR/ADza665ac%3D"
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o /tmp/release.zip
          mkdir -p /tmp/release /tmp/preview
          unzip -q /tmp/release.zip -d /tmp/release
          unzip -q /tmp/release/Loraniq-Admin-v1.0.0-Preview.zip -d /tmp/preview
          test -f /tmp/preview/index.html
          test -f /tmp/preview/.nojekyll

      - name: Replace repository with verified build
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/preview/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish verified Loraniq Admin 1.0.0 preview"
          git push origin HEAD:main
