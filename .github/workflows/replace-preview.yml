name: Replace public preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-preview.yml'
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download verified final artifact
        env:
          ARTIFACT_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-328c-8210-92f1-c8d2146a78d3/raw?se=2026-09-23T19%3A13%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=a3d7b340-b8c6-541e-96bf-54b63034f41a&skoid=8981e47a-681f-4a6a-b86c-73d6347614b7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T18%3A23%3A55Z&ske=2026-09-24T18%3A23%3A55Z&sks=b&skv=2026-02-06&sig=Vy0so8tCxnZ1WKyE/h0xsTXs0B9YIq0howS2IEHLMOM%3D"
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o /tmp/release.zip
          mkdir -p /tmp/release /tmp/preview
          unzip -q /tmp/release.zip -d /tmp/release
          unzip -q /tmp/release/Loraniq-Admin-v1.0.0-Preview.zip -d /tmp/preview
          test -f /tmp/preview/index.html
          test -f /tmp/preview/.nojekyll
      - name: Atomically replace repository content
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/preview/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish final verified Loraniq Admin 1.0.0 preview"
          git push origin HEAD:main
