<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" direction="rtl">
 <defs><linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5f52dd"/><stop offset="1" stop-color="#9b5ee8"/></linearGradient><filter id="s"><feDropShadow dy="14" stdDeviation="20" flood-color="#332a75" flood-opacity=".1"/></filter></defs><rect width="1200" height="1800" fill="#f8f8fc"/><rect width="1200" height="430" fill="#1d1a35"/><circle cx="1090" cy="70" r="240" fill="#7367f0" opacity=".15"/><g font-family="Tahoma,Arial" text-anchor="middle"><rect x="559" y="55" width="82" height="82" rx="24" fill="url(#hero)"/><text x="600" y="112" font-family="Arial" fill="white" font-size="50" font-weight="700">L</text><text x="600" y="182" fill="white" font-size="39" font-weight="800">لورانیک؛ پنل مدیریت فارسی</text><text x="600" y="224" fill="#bbb6d2" font-size="19">تجربه‌ای تازه برای ساخت محصولات حرفه‌ای</text><rect x="484" y="269" width="232" height="54" rx="27" fill="url(#hero)"/><text x="600" y="304" fill="white" font-size="17" font-weight="700">نسخه نهایی ۱.۰.۰</text></g>
 <g font-family="Tahoma,Arial"><g transform="translate(80 365)"><rect width="1040" height="210" rx="28" fill="white" filter="url(#s)"/><g text-anchor="middle"><text x="130" y="79" fill="#7367f0" font-size="35" font-weight="800">۱۰۰٪</text><text x="130" y="113" fill="#77758a" font-size="15">راست‌چین واقعی</text><text x="390" y="79" fill="#7367f0" font-size="35" font-weight="800">۱۰</text><text x="390" y="113" fill="#77758a" font-size="15">فضای کاری</text><text x="650" y="79" fill="#7367f0" font-size="35" font-weight="800">۲</text><text x="650" y="113" fill="#77758a" font-size="15">حالت رنگی</text><text x="910" y="79" fill="#7367f0" font-size="35" font-weight="800">۱.۰.۰</text><text x="910" y="113" fill="#77758a" font-size="15">نسخه ثابت</text></g><path d="M260 45v115M520 45v115M780 45v115" stroke="#eceaf3"/></g>
 <text x="600" y="650" text-anchor="middle" fill="#27253a" font-size="34" font-weight="800">هر چیزی که برای مدیریت نیاز دارید</text><text x="600" y="686" text-anchor="middle" fill="#77758a" font-size="16">یک سیستم منسجم، نه مجموعه‌ای از صفحات پراکنده</text>
 <g transform="translate(80 740)"><g fill="white" filter="url(#s)"><rect width="330" height="190" rx="22"/><rect x="355" width="330" height="190" rx="22"/><rect x="710" width="330" height="190" rx="22"/><rect y="215" width="330" height="190" rx="22"/><rect x="355" y="215" width="330" height="190" rx="22"/><rect x="710" y="215" width="330" height="190" rx="22"/></g><g text-anchor="end"><g transform="translate(0)"><rect x="250" y="25" width="52" height="52" rx="15" fill="#eeeaff"/><text x="282" y="60" font-size="25" text-anchor="middle">◈</text><text x="302" y="112" font-size="18" font-weight="700">تجارت هوشمند</text><text x="302" y="143" fill="#77758a" font-size="13">فروش، سفارش، محصول و انبار</text></g><g transform="translate(355)"><rect x="250" y="25" width="52" height="52" rx="15" fill="#e6f6f1"/><text x="282" y="60" font-size="25" text-anchor="middle">⌁</text><text x="302" y="112" font-size="18" font-weight="700">تحلیل داده</text><text x="302" y="143" fill="#77758a" font-size="13">نمودارها و شاخص‌های زنده</text></g><g transform="translate(710)"><rect x="250" y="25" width="52" height="52" rx="15" fill="#e9f2ff"/><text x="282" y="60" font-size="25" text-anchor="middle">✓</text><text x="302" y="112" font-size="18" font-weight="700">مدیریت پروژه</text><text x="302" y="143" fill="#77758a" font-size="13">برد کاری، تیم و پیشرفت</text></g><g transform="translate(0 215)"><rect x="250" y="25" width="52" height="52" rx="15" fill="#fff0e6"/><text x="282" y="60" font-size="25" text-anchor="middle">﷼</text><text x="302" y="112" font-size="18" font-weight="700">امور مالی</text><text x="302" y="143" fill="#77758a" font-size="13">درآمد، هزینه و صورتحساب</text></g><g transform="translate(355 215)"><rect x="250" y="25" width="52" height="52" rx="15" fill="#fff0f5"/><text x="282" y="60" font-size="25" text-anchor="middle">●</text><text x="302" y="112" font-size="18" font-weight="700">مدیریت مشتری</text><text x="302" y="143" fill="#77758a" font-size="13">سرنخ، ارتباط و پیگیری</text></g><g transform="translate(710 215)"><rect x="250" y="25" width="52" height="52" rx="15" fill="#f0edff"/><text x="282" y="60" font-size="25" text-anchor="middle">◇</text><text x="302" y="112" font-size="18" font-weight="700">آکادمی آنلاین</text><text x="302" y="143" fill="#77758a" font-size="13">دوره، مدرس و دانشجو</text></g></g></g>
 <rect x="80" y="1230" width="1040" height="360" rx="30" fill="#211e39"/><text x="600" y="1305" text-anchor="middle" fill="white" font-size="30" font-weight="800">ساخته‌شده برای وب فارسی</text><g text-anchor="middle"><g transform="translate(135 1350)"><rect width="210" height="150" rx="20" fill="#ffffff0d" stroke="#ffffff16"/><text x="105" y="58" fill="#a99eff" font-size="25">اب</text><text x="105" y="96" fill="white" font-size="15" font-weight="700">تایپوگرافی فارسی</text><text x="105" y="121" fill="#aaa6bc" font-size="11">خوانا و خوش‌وزن</text></g><g transform="translate(365 1350)"><rect width="210" height="150" rx="20" fill="#ffffff0d" stroke="#ffffff16"/><text x="105" y="58" fill="#55d0b2" font-size="25">☾</text><text x="105" y="96" fill="white" font-size="15" font-weight="700">روشن و تیره</text><text x="105" y="121" fill="#aaa6bc" font-size="11">کنتراست دقیق</text></g><g transform="translate(595 1350)"><rect width="210" height="150" rx="20" fill="#ffffff0d" stroke="#ffffff16"/><text x="105" y="58" fill="#ffad7d" font-size="25">↔</text><text x="105" y="96" fill="white" font-size="15" font-weight="700">کاملاً واکنش‌گرا</text><text x="105" y="121" fill="#aaa6bc" font-size="11">موبایل تا دسکتاپ</text></g><g transform="translate(825 1350)"><rect width="210" height="150" rx="20" fill="#ffffff0d" stroke="#ffffff16"/><text x="105" y="58" fill="#75a9ed" font-size="25">⚡</text><text x="105" y="96" fill="white" font-size="15" font-weight="700">سریع و توسعه‌پذیر</text><text x="105" y="121" fill="#aaa6bc" font-size="11">ساختار مدرن</text></g></g>
 <text x="600" y="1685" text-anchor="middle" fill="#27253a" font-size="29" font-weight="800">لورانیک؛ شروع سریع‌تر، محصول بهتر.</text><text x="600" y="1730" text-anchor="middle" fill="#7367f0" font-size="17" font-weight="700">قالب پنل مدیریت حرفه‌ای و کاملاً راست‌چین</text></g>
</svg>
